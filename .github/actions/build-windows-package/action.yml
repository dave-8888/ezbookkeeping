name: Build packages for windows

inputs:
  package-file-name-prefix:
    required: true
    type: string
  package-artifact-name-prefix:
    required: true
    type: string
  backend-artifact-name-prefix:
    required: true
    type: string

runs:
  using: "composite"
  steps:
    - name: Download windows-x64 backend file
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.backend-artifact-name-prefix }}-windows-x64
        path: ${{ runner.temp }}\backend

    - name: Download linux-amd64 packaged files
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.package-artifact-name-prefix }}-linux-amd64
        path: ${{ runner.temp }}\package

    - name: Extract frontend files from linux-amd64 package
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path package
        tar -xzf (Get-ChildItem ${{ runner.temp }}\package\${{ inputs.package-file-name-prefix }}-linux-amd64.tar.gz) -C package

    - name: Package windows-x64 package
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path "financially_free"
        New-Item -ItemType Directory -Path "financially_free\data"
        New-Item -ItemType Directory -Path "financially_free\storage"
        New-Item -ItemType Directory -Path "financially_free\log"
        Copy-Item ${{ runner.temp }}\backend\financially_free.exe -Destination financially_free\
        Copy-Item -Recurse -Force package\public -Destination financially_free\public
        Copy-Item -Recurse -Force conf -Destination financially_free\conf
        Copy-Item -Recurse -Force templates -Destination financially_free\templates
        Copy-Item .\LICENSE -Destination financially_free\
        Push-Location financially_free
        7z a -r -tzip -mx9 ..\${{ inputs.package-file-name-prefix }}-windows-x64.zip *
        Pop-Location
        Remove-Item -Recurse -Force financially_free

    - name: Upload windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.package-artifact-name-prefix }}-windows-x64
        path: ${{ inputs.package-file-name-prefix }}-windows-x64.zip
        if-no-files-found: error
