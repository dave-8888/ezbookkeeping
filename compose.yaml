name: ezbookkeeping

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ezbookkeeping:local
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      EBK_CONF_PATH: /ezbookkeeping/conf/ezbookkeeping.ini
      EBK_SERVER_DOMAIN: ${EBK_SERVER_DOMAIN:-localhost}
      EBK_SERVER_ROOT_URL: ${EBK_SERVER_ROOT_URL:-http://localhost:8080/}
      EBK_SECURITY_SECRET_KEY: ${EBK_SECURITY_SECRET_KEY:-change-me-before-production}
    volumes:
      - ./docker/ezbookkeeping.docker.ini:/ezbookkeeping/conf/ezbookkeeping.ini:ro
      - ezbookkeeping_data:/ezbookkeeping/data
      - ezbookkeeping_log:/ezbookkeeping/log
      - ezbookkeeping_storage:/ezbookkeeping/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O - http://127.0.0.1:8080/healthz.json >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  ezbookkeeping_data:
  ezbookkeeping_log:
  ezbookkeeping_storage:
